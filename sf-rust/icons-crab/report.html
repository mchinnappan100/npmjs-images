<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="https://mohan-chinnappan-n5.github.io/dfv/img/mc_favIcon.ico"/>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Icon Report — 🦀</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff}
@media(prefers-color-scheme:light){:root{--bg:#fff;--bg2:#f6f8fa;--bg3:#eaeef2;--border:#d0d7de;--text:#1f2328;--muted:#656d76;--accent:#0969da}}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.6}
.page{max-width:980px;margin:0 auto;padding:2rem 1.5rem 4rem}
h1{font-size:1.5rem;font-weight:700;margin-bottom:.3rem}
.sub{color:var(--muted);font-size:.82rem;margin-bottom:2rem}
.config{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1.2rem 1.5rem;margin-bottom:2rem;display:flex;flex-wrap:wrap;gap:1.5rem;align-items:center}
.swatches{display:flex;gap:.5rem}
.swatch{width:44px;height:44px;border-radius:8px;border:1px solid var(--border);flex-shrink:0}
.cfg-row{display:flex;flex-direction:column;gap:.15rem}
.cfg-lbl{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em}
.cfg-val{font-weight:600;font-family:"JetBrains Mono","SF Mono",monospace;font-size:.82rem}
h2{font-size:1rem;font-weight:600;color:var(--accent);margin:2rem 0 1rem;border-bottom:1px solid var(--border);padding-bottom:.4rem}
.grid{display:flex;flex-wrap:wrap;gap:1.4rem;align-items:flex-end;margin-top:.5rem}
.preview-item{display:flex;flex-direction:column;align-items:center;gap:.35rem;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:.6rem .8rem}
.sz-label{font-size:.68rem;color:var(--muted);font-family:monospace}
img{display:block;image-rendering:pixelated;border-radius:4px}
footer{margin-top:3rem;border-top:1px solid var(--border);padding-top:1rem;text-align:center;color:var(--muted);font-size:.75rem}
</style>
</head>
<body>
<div class="page">
  <h1>🖼 Icon Report — 🦀</h1>
  <p class="sub">8 sizes &nbsp;·&nbsp; generated 2026-11-15 07:26:59</p>

  <div class="config">
    <div class="swatches">
      <div class="swatch" style="background:#1c2030" title="Background #1c2030"></div>
      <div class="swatch" style="background:#FFFFFF" title="Foreground #FFFFFF"></div>
    </div>
    <div class="cfg-row"><span class="cfg-lbl">Text</span><span class="cfg-val">🦀</span></div>
    <div class="cfg-row"><span class="cfg-lbl">Mode</span><span class="cfg-val">emoji (Twemoji)</span></div>
    <div class="cfg-row"><span class="cfg-lbl">Background</span><span class="cfg-val">#1c2030</span></div>
    <div class="cfg-row"><span class="cfg-lbl">Foreground</span><span class="cfg-val">#FFFFFF</span></div>
    <div class="cfg-row"><span class="cfg-lbl">Radius</span><span class="cfg-val">20%</span></div>
    <div class="cfg-row"><span class="cfg-lbl">Font</span><span class="cfg-val">Arial</span></div>
  </div>

  <h2>All sizes</h2>
  <div class="grid">
    <div class="preview-item">
  <img src="icon16.png" width="16" height="16" alt="16"/>
  <div class="sz-label">16×16</div>
</div><div class="preview-item">
  <img src="icon32.png" width="32" height="32" alt="32"/>
  <div class="sz-label">32×32</div>
</div><div class="preview-item">
  <img src="icon48.png" width="48" height="48" alt="48"/>
  <div class="sz-label">48×48</div>
</div><div class="preview-item">
  <img src="icon64.png" width="64" height="64" alt="64"/>
  <div class="sz-label">64×64</div>
</div><div class="preview-item">
  <img src="icon128.png" width="128" height="128" alt="128"/>
  <div class="sz-label">128×128</div>
</div><div class="preview-item">
  <img src="icon256.png" width="128" height="128" alt="256"/>
  <div class="sz-label">256×256</div>
</div><div class="preview-item">
  <img src="icon512.png" width="128" height="128" alt="512"/>
  <div class="sz-label">512×512</div>
</div><div class="preview-item">
  <img src="icon1024.png" width="128" height="128" alt="1024"/>
  <div class="sz-label">1024×1024</div>
</div>
  </div>

  <footer>sf-rust icon &nbsp;·&nbsp; 2026-11-15 07:26:59</footer>
</div>
</body>
</html>
